name: Enforce Repository Governance Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/rulesets/branch-ruleset.json'
      - '.github/workflows/enforce-governance.yml'

# GITHUB_TOKEN does not expose repository Administration: write.
# The privileged operation uses a repository-scoped fine-grained PAT secret.
permissions:
  contents: read

concurrency:
  group: aktops-governance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-and-apply:
    name: Validate and apply SOP-SEC-042
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate policy JSON
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .name == "AKTOps - SOP-SEC-042" and
            .target == "branch" and
            .enforcement == "active" and
            (.conditions.ref_name.include | index("~DEFAULT_BRANCH")) and
            ([.rules[].type] | index("deletion")) and
            ([.rules[].type] | index("non_fast_forward")) and
            ([.rules[].type] | index("required_linear_history")) and
            ([.rules[].type] | index("pull_request"))
          ' .github/rulesets/branch-ruleset.json > /dev/null

      - name: Require governance credential
        env:
          GOVERNANCE_TOKEN: ${{ secrets.REPO_GOVERNANCE_PAT }}
        shell: bash
        run: |
          if [ -z "$GOVERNANCE_TOKEN" ]; then
            echo "::error::REPO_GOVERNANCE_PAT is required. Configure a fine-grained token with repository Administration: write."
            exit 1
          fi

      - name: Apply repository ruleset (create or update)
        env:
          GH_TOKEN: ${{ secrets.REPO_GOVERNANCE_PAT }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ruleset_name="$(jq -r '.name' .github/rulesets/branch-ruleset.json)"
          existing_ids="$(gh api --paginate "/repos/$REPOSITORY/rulesets" --jq ".[] | select(.name == \"$ruleset_name\") | .id")"

          count="$(printf '%s\n' "$existing_ids" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple rulesets named '$ruleset_name' exist. Resolve duplicates manually."
            exit 1
          elif [ "$count" -eq 1 ]; then
            ruleset_id="$(printf '%s\n' "$existing_ids" | head -n 1)"
            gh api --method PUT "/repos/$REPOSITORY/rulesets/$ruleset_id" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --input .github/rulesets/branch-ruleset.json
            echo "Updated ruleset ID $ruleset_id."
          else
            gh api --method POST "/repos/$REPOSITORY/rulesets" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --input .github/rulesets/branch-ruleset.json
            echo "Created ruleset."
          fi
